name: Release

# Publishes a GitHub Release for a version tag. The downloadable SDK is that release's own source
# archive, which GitHub generates -- there is nothing to build and nothing to upload.
#
# WHY THIS EXISTS
#
# Nothing published this repository's tags. v1.2.0 existed on the remote with no release, so there was
# no archive for the dashboard to hand an author and tagging was a local act with no consequence
# anywhere.
#
# WHAT THIS DELIBERATELY DOES NOT DO
#
# It does not notify Packagist, because nothing needs it to. The repository is already connected
# there through Packagist's GitHub integration, which picks up a pushed tag on its own -- verified by
# resolving `composer require codexpertio/plugin-tracker-sdk:^1.2`, which locks v1.2.0. An API call
# from here would be a second, weaker copy of a hook that already works, plus two secrets to hold.
#
# WHY THERE IS NO BUILD STEP
#
# There used to be one: bin/build-dist.sh rewrote the SDK into a per-version namespace so two
# plugins could bundle different copies on one site without their class declarations colliding. That
# scoping was dropped deliberately, which leaves nothing to assemble -- .gitattributes already trims
# the archive to the runtime files (src/, views/, languages/, composer.json, LICENSE, README.md,
# autoload.php), and `git archive` is what produces both a GitHub source zip and a Composer
# --prefer-dist download. The two routes now ship identical bytes, which they never did before.
#
# THE CHECK THAT MATTERS
#
# The tag and Tracker::VERSION must agree, and this refuses to publish when they do not.
#
# The consuming dashboard picks its integration snippet from its own
# Telemetry_Provisioning::DEFAULT_SDK_VERSION and hands out this archive alongside it. When those
# disagree the failure is silent: the snippet requires autoload.php and calls the class name it
# returns, so an archive that predates a method the snippet relies on fails at a call site rather
# than at load, on somebody else's site. A mismatched publish is worse than a failed one.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (e.g. v1.2.0)'
        required: true

defaults:
  run:
    shell: bash

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Refuse a tag that disagrees with Tracker::VERSION
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          source_version="$(grep -oE "const VERSION = '[^']+'" src/Tracker.php | grep -oE "[0-9][0-9A-Za-z.+_-]*")"

          if [ -z "${source_version}" ]; then
            echo "::error::Could not read const VERSION from src/Tracker.php"
            exit 1
          fi

          # The tag carries a leading v by convention; the constant does not.
          if [ "${tag#v}" != "${source_version}" ]; then
            echo "::error::Tag ${tag} does not match Tracker::VERSION ${source_version}. Publishing this would hand consumers an archive whose version the integration snippet does not expect, and that failure is silent -- see the header."
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Tag ${tag} agrees with Tracker::VERSION ${source_version}"

      # autoload.php is the one file a consumer cannot integrate without: the snippet requires it and
      # calls the class name it returns. It used to be generated by the build, so a release without it
      # is exactly the regression this move could introduce -- checked here rather than discovered by
      # the first author who unzips it.
      - name: Refuse an archive that a consumer cannot integrate
        run: |
          # Listed once into a file, then grepped, rather than re-piped per path.
          #
          # The pipe was wrong, not just wasteful. This step runs under `set -o pipefail`, and
          # `grep -q` exits the moment it matches -- which hands `tar` a SIGPIPE, fails the pipeline,
          # and reports a file as ABSENT precisely when it is PRESENT. The first run of this workflow
          # flagged composer.json that way while correctly flagging autoload.php, which is how a guard
          # earns the wrong kind of reputation.
          git archive --format=tar HEAD > /tmp/release-archive.tar
          tar -tf /tmp/release-archive.tar > /tmp/release-archive.list

          missing=0

          for path in autoload.php src/Tracker.php composer.json; do
            if ! grep -qx -- "${path}" /tmp/release-archive.list; then
              echo "::error::${path} is absent from the release archive. Check .gitattributes -- export-ignore governs what git archive emits, and it is what GitHub serves."
              missing=1
            fi
          done

          [ "${missing}" -eq 0 ] || exit 1

          echo "Archive carries autoload.php, src/Tracker.php and composer.json"

      # Idempotent on purpose: re-running for an existing tag is a no-op rather than a failure, which
      # is what makes workflow_dispatch a usable recovery path. GitHub attaches the source archives to
      # the release itself, so there is no asset to upload or replace.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; nothing to do."
            exit 0
          fi

          gh release create "${TAG}" --title "${TAG}" --generate-notes
